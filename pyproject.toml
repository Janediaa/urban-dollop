[project]
name = "healthcare-navigator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "langgraph>=1.2.18",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
